# Runs the offline tests on every push and pull request.
#
# Only the pure-logic parts of the pipeline can run here: the GitHub runner has
# no camera and no trained model, so this catches logic regressions (e.g. the
# debouncer committing a letter twice), never recognition accuracy. Accuracy
# still comes from running evaluate.py by hand.
#
# Only symspellpy is installed -- not MediaPipe or scikit-learn -- so the job
# still finishes in seconds and needs no camera or trained model.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The one dependency the tests need: nlp_bridge.py's tests guard the
      # pkg_resources crash and the per-frame correction cache. Pinned to match
      # requirements.txt. Everything else stays standard-library only.
      - name: Install test dependencies
        run: pip install symspellpy==6.10.0

      - name: Run offline tests
        run: python -m unittest discover -p "test_*.py" -v
