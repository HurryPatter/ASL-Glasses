# Runs the offline tests on every push and pull request.
#
# Only the pure-logic parts of the pipeline can run here: the GitHub runner has
# no camera and no trained model, so this catches logic regressions (e.g. the
# debouncer committing a letter twice), never recognition accuracy. Accuracy
# still comes from running evaluate.py by hand.
#
# No pip install step on purpose -- the test modules import only debouncer.py,
# dataset.py, motion.py, hands.py, location.py and sequence.py plus the
# standard library, so they need neither MediaPipe nor scikit-learn and finish
# in seconds. Keeping those six dependency-free is what keeps this job honest;
# a numpy import in any of them silently turns this into a no-op.

name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline tests
        run: python -m unittest discover -p "test_*.py" -v
